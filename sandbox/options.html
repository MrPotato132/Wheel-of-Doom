<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wheel of Faith — Pure Fantasy Combat Sandbox</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #06050b; color: #f8fafc; font-family: 'Cinzel', serif, system-ui; overflow: hidden; }
    .sandbox-bar { position: fixed; top: 12px; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: rgba(15,12,24,0.96); border: 1.5px solid #d97706; padding: 8px 16px; border-radius: 99px; box-shadow: 0 8px 32px rgba(217,119,6,0.3); backdrop-filter: blur(12px); }
    .act-btn { background: #1c152a; border: 1px solid #d97706; color: #fde68a; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-weight: 800; font-size: 0.76rem; transition: 0.2s; font-family: inherit; }
    .act-btn:hover { background: #d97706; color: #000; transform: translateY(-1px); }
    .arena-stage { position: relative; width: 760px; height: 430px; border-radius: 18px; background: radial-gradient(circle at center, #1e1330 0%, #0a0614 100%); border: 2px solid #b45309; box-shadow: 0 0 50px rgba(180,83,9,0.45); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 22px; box-sizing: border-box; }
    .fighters-row { display: flex; justify-content: space-between; align-items: center; z-index: 30; margin: auto 0; padding: 0 20px; }
    .f-pod { width: 230px; background: rgba(18,14,30,0.94); border: 2px solid #d97706; border-radius: 14px; padding: 16px; text-align: center; transition: 0.25s; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    .f-avatar { font-size: 2.2rem; margin-bottom: 6px; }
    .f-name { font-weight: 900; font-size: 1.05rem; color: #fef3c7; }
    .f-class { font-size: 0.75rem; color: #f59e0b; font-weight: 800; margin-top: 3px; }
    .f-hp-bar { height: 10px; border-radius: 99px; background: #261b36; overflow: hidden; margin-top: 8px; border: 1px solid #451a03; }
    .f-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10b981, #059669); transition: width 0.3s; }
    .f-hp-text { font-size: 0.72rem; color: #cbd5e1; margin-top: 4px; font-weight: 700; }
    .log-banner { text-align: center; font-size: 0.84rem; color: #fde68a; font-weight: 700; background: rgba(0,0,0,0.65); border: 1px solid rgba(217,119,6,0.3); padding: 8px; border-radius: 8px; min-height: 20px; }
    .hit-shake { animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(8px, -4px); } 60% { transform: translate(-6px, 2px); } 80% { transform: translate(6px, -2px); } }
  </style>
</head>
<body>
  <div class="sandbox-bar">
    <button class="act-btn" id="btnStrike">⚔️ Heavy Strike</button>
    <button class="act-btn" id="btnCrit">💥 Critical Smite</button>
    <button class="act-btn" id="btnMagic">✨ Arcane Burst</button>
    <button class="act-btn" id="btnGamble">🎲 Gambler Wager</button>
    <button class="act-btn" id="btnReset">🔄 Reset HP</button>
  </div>
  <div class="arena-stage">
    <div style="text-align:center;font-weight:900;letter-spacing:0.18em;color:#f59e0b;font-size:0.95rem;">COLOSSEUM FANTASY COMBAT LAB</div>
    <div class="fighters-row">
      <div class="f-pod" id="podA">
        <div class="f-avatar">⚔️</div>
        <div class="f-name">Sir Bushin</div>
        <div class="f-class">Human Champion • Excalibur</div>
        <div class="f-hp-bar"><div class="f-hp-fill" id="hpFillA"></div></div>
        <div class="f-hp-text" id="hpTextA">500 / 500 HP</div>
      </div>
      <div style="font-size:1.6rem;font-weight:900;color:#f59e0b;">VS</div>
      <div class="f-pod" id="podB">
        <div class="f-avatar">👿</div>
        <div class="f-name">Jin the Shadow</div>
        <div class="f-class">Demon Assassin • Shadow Manipulation</div>
        <div class="f-hp-bar"><div class="f-hp-fill" id="hpFillB"></div></div>
        <div class="f-hp-text" id="hpTextB">500 / 500 HP</div>
      </div>
    </div>
    <div class="log-banner" id="logBanner">Select a combat action to test arena mechanics!</div>
  </div>
  <script>
    let hpA = 500, hpB = 500, maxHp = 500, turn = 0;
    const log = document.getElementById('logBanner');
    function updateBars() {
      document.getElementById('hpFillA').style.width = Math.max(0, (hpA / maxHp) * 100) + '%';
      document.getElementById('hpTextA').textContent = `${Math.max(0, hpA)} / ${maxHp} HP`;
      document.getElementById('hpFillB').style.width = Math.max(0, (hpB / maxHp) * 100) + '%';
      document.getElementById('hpTextB').textContent = `${Math.max(0, hpB)} / ${maxHp} HP`;
    }
    function dealDamage(isAAttacking, dmg, label) {
      const targetPod = isAAttacking ? document.getElementById('podB') : document.getElementById('podA');
      if (isAAttacking) hpB = Math.max(0, hpB - dmg); else hpA = Math.max(0, hpA - dmg);
      targetPod.classList.add('hit-shake');
      setTimeout(() => targetPod.classList.remove('hit-shake'), 320);
      log.textContent = `${isAAttacking ? 'Sir Bushin' : 'Jin'} executes ${label}! -${dmg} DMG.`;
      updateBars();
      turn++;
    }
    document.getElementById('btnStrike').addEventListener('click', () => dealDamage(turn % 2 === 0, 48 + Math.floor(Math.random() * 24), '⚔️ Heavy Strike'));
    document.getElementById('btnCrit').addEventListener('click', () => dealDamage(turn % 2 === 0, 110 + Math.floor(Math.random() * 45), '💥 Critical Smite'));
    document.getElementById('btnMagic').addEventListener('click', () => dealDamage(turn % 2 === 0, 80 + Math.floor(Math.random() * 30), '✨ Arcane Burst'));
    document.getElementById('btnGamble').addEventListener('click', () => {
      const roll = Math.random();
      if (roll > 0.5) dealDamage(turn % 2 === 0, 180, '🎲 Jackpot Fever (Gambler Wager WIN)');
      else dealDamage(turn % 2 !== 0, 75, '💀 Backfire (Gambler Wager LOSS)');
    });
    document.getElementById('btnReset').addEventListener('click', () => { hpA = 500; hpB = 500; updateBars(); log.textContent = 'Arena combatants restored to full vitality!'; });
  </script>
</body>
</html>
