<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of Faith - Sandbox Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: radial-gradient(circle at 50% 20%, #0d1a33 0%, #060b14 70%); color: var(--text-primary); min-height: 100vh; padding: 16px; font-family: var(--font-body); }
    .sandbox-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--bg-card); border: 1px solid var(--border-blue); border-radius: var(--radius-md); box-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 24px; }
    .sandbox-link { color: var(--cyan-accent); text-decoration: none; font-weight: 700; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
    .sandbox-link:hover { text-decoration: underline; }
    .take-group { display: flex; gap: 8px; }
    .take-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border-silver); color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
    .take-btn.active { background: var(--blue-primary); color: #fff; border-color: var(--cyan-accent); box-shadow: 0 0 12px var(--cyan-glow); }
    .controls-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: rgba(4,12,24,0.6); padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-silver); }
    .slider-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .slider-item input[type=range] { accent-color: var(--cyan-accent); width: 100px; }
    .slider-item b { color: var(--cyan-accent); min-width: 32px; }
    .sandbox-stage { display: flex; justify-content: center; align-items: center; padding: 24px; }
    .sandbox-preview-card { width: 100%; max-width: 460px; background: var(--bg-card); border: 2px solid var(--border-blue); border-radius: var(--radius-md); padding: 24px; text-align: center; box-shadow: 0 0 calc(var(--preview-glow, 16) * 1px) rgba(0, 240, 255, 0.45); transition: border-color 0.3s; }
    .sandbox-preview-card h2 { font-family: var(--font-heading); color: var(--cyan-accent); margin-bottom: 6px; }
    .sandbox-badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-full); background: rgba(56, 189, 248, 0.2); border: 1px solid var(--border-blue); font-size: 0.76rem; font-weight: 800; letter-spacing: 0.08em; margin-bottom: 14px; }
    .sandbox-pulse-box { width: 90px; height: 90px; margin: 16px auto; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--blue-primary), var(--cyan-accent)); display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 20px var(--cyan-glow); animation: previewPulse calc(var(--preview-speed, 2) * 1s) ease-in-out infinite alternate; }
    @keyframes previewPulse { from { transform: scale(0.95); opacity: 0.85; } to { transform: scale(1.08) rotate(calc(var(--preview-shake, 4) * 1deg)); opacity: 1; } }
  </style>
</head>
<body>
  <header class="sandbox-bar">
    <a href="../index.html" class="sandbox-link">🏠 Back to Live Arena</a>
    <div class="take-group">
      <button class="take-btn active" data-take="A">Take A: Oceanic</button>
      <button class="take-btn" data-take="B">Take B: Cyber Cyan</button>
      <button class="take-btn" data-take="C">Take C: Celestial Void</button>
    </div>
    <div class="controls-row">
      <label class="slider-item">Glow: <input type="range" id="glowSlider" min="4" max="40" value="18"> <b id="glowVal">18</b></label>
      <label class="slider-item">Shake: <input type="range" id="shakeSlider" min="0" max="15" value="4"> <b id="shakeVal">4°</b></label>
      <label class="slider-item">Speed: <input type="range" id="speedSlider" min="0.5" max="4" step="0.25" value="1.75"> <b id="speedVal">1.75s</b></label>
    </div>
  </header>
  <main class="sandbox-stage">
    <div class="sandbox-preview-card" id="previewCard">
      <span class="sandbox-badge" id="takeBadge">TAKE A • OCEANIC SAPPHIRE</span>
      <h2 id="previewTitle">Sandbox Lab Preview</h2>
      <p id="previewDesc" style="color:var(--text-secondary); font-size:0.86rem; line-height:1.45;">Test visual takes, VFX animations, and wheel parameters in real time before promoting to live.</p>
      <div class="sandbox-pulse-box" id="pulseBox">⚡</div>
      <div style="font-size:0.75rem; color:var(--text-muted);">Reactive Sandbox State • Live Preview Mode</div>
    </div>
  </main>
  <script>
    const card = document.getElementById('previewCard'), badge = document.getElementById('takeBadge'), title = document.getElementById('previewTitle'), desc = document.getElementById('previewDesc');
    const glow = document.getElementById('glowSlider'), shake = document.getElementById('shakeSlider'), speed = document.getElementById('speedSlider');
    function sync() {
      card.style.setProperty('--preview-glow', glow.value); card.style.setProperty('--preview-shake', shake.value); card.style.setProperty('--preview-speed', speed.value);
      document.getElementById('glowVal').textContent = glow.value; document.getElementById('shakeVal').textContent = shake.value + '°'; document.getElementById('speedVal').textContent = speed.value + 's';
    }
    [glow, shake, speed].forEach(s => s.addEventListener('input', sync)); sync();
    const takes = {
      A: { badge: 'TAKE A • OCEANIC SAPPHIRE', title: 'Oceanic Sapphire Flow', desc: 'Deep midnight blues with luminous ocean crests and soft rhythmic pulse.', border: 'rgba(56, 189, 248, 0.4)' },
      B: { badge: 'TAKE B • CYBER CYAN', title: 'High-Voltage Cyan', desc: 'Sharper electric contrast with neon edging and energetic pulse velocity.', border: '#00f0ff' },
      C: { badge: 'TAKE C • CELESTIAL VOID', title: 'Deep Void Starlight', desc: 'Dark abyssal backdrop with concentrated violet-cyan celestial flares.', border: '#a855f7' }
    };
    document.querySelectorAll('.take-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.take-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
      const t = takes[btn.dataset.take]; badge.textContent = t.badge; title.textContent = t.title; desc.textContent = t.desc; card.style.borderColor = t.border;
    }));
  </script>
</body>
</html>
