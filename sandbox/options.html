<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of Faith - Sandbox Lab</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: radial-gradient(circle at 50% 20%, #0d1a33 0%, #060b14 70%); color: var(--text-primary); min-height: 100vh; padding: 16px; font-family: var(--font-body); margin: 0; }
    .sandbox-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--bg-card); border: 1px solid var(--border-blue); border-radius: var(--radius-md); box-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 24px; }
    .sandbox-link { color: var(--cyan-accent); text-decoration: none; font-weight: 700; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
    .sandbox-link:hover { text-decoration: underline; }
    .take-group { display: flex; gap: 8px; }
    .take-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border-silver); color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
    .take-btn.active { background: var(--blue-primary); color: #fff; border-color: var(--cyan-accent); box-shadow: 0 0 12px var(--cyan-glow); }
    .controls-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: rgba(4,12,24,0.6); padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-silver); }
    .slider-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; }
    .slider-item input[type=range] { accent-color: var(--cyan-accent); width: 95px; }
    .slider-item b { color: var(--cyan-accent); min-width: 32px; }
    .btn-promote { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: 1px solid #34d399; padding: 7px 15px; border-radius: var(--radius-full); font-weight: 800; font-size: 0.8rem; cursor: pointer; box-shadow: 0 0 12px rgba(16,185,129,0.4); }
    .btn-promote:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(16,185,129,0.7); }
    .sandbox-stage { display: flex; justify-content: center; align-items: center; padding: 24px; }
    .sandbox-preview-card { width: 100%; max-width: 480px; background: var(--bg-card); border: 2px solid var(--border-blue); border-radius: var(--radius-md); padding: 26px; text-align: center; box-shadow: 0 0 calc(var(--preview-glow, 18) * 1px) rgba(0, 240, 255, 0.45); transition: border-color 0.3s; }
    .sandbox-preview-card h2 { font-family: var(--font-heading); color: var(--cyan-accent); margin-bottom: 6px; }
    .sandbox-badge { display: inline-block; padding: 3px 12px; border-radius: var(--radius-full); background: rgba(56, 189, 248, 0.2); border: 1px solid var(--border-blue); font-size: 0.76rem; font-weight: 800; letter-spacing: 0.08em; margin-bottom: 14px; }
    .sandbox-pulse-box { width: 90px; height: 90px; margin: 16px auto; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--blue-primary), var(--cyan-accent)); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 0 20px var(--cyan-glow); animation: previewPulse calc(var(--preview-speed, 1.75) * 1s) ease-in-out infinite alternate; }
    @keyframes previewPulse { from { transform: scale(0.95); opacity: 0.85; } to { transform: scale(1.08) rotate(calc(var(--preview-shake, 4) * 1deg)); opacity: 1; } }
    .promote-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #064e3b; border: 1px solid #10b981; color: #ecfdf5; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
    .promote-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="sandbox-bar">
    <a href="../index.html" class="sandbox-link">🏠 Back to Live Arena</a>
    <div class="take-group">
      <button class="take-btn active" data-take="A">Take A</button>
      <button class="take-btn" data-take="B">Take B</button>
      <button class="take-btn" data-take="C">Take C</button>
    </div>
    <div class="controls-row">
      <label class="slider-item">Glow: <input type="range" id="glowSlider" min="4" max="40" value="18"> <b id="glowVal">18px</b></label>
      <label class="slider-item">Shake: <input type="range" id="shakeSlider" min="0" max="15" value="4"> <b id="shakeVal">4°</b></label>
      <label class="slider-item">Speed: <input type="range" id="speedSlider" min="0.5" max="4" step="0.25" value="1.75"> <b id="speedVal">1.75s</b></label>
      <button class="btn-promote" id="btnPromote">🚀 Promote to Live</button>
    </div>
  </header>
  <main class="sandbox-stage">
    <div class="sandbox-preview-card" id="previewCard">
      <span class="sandbox-badge" id="takeBadge">TAKE A • OCEANIC SAPPHIRE</span>
      <h2 id="previewTitle">Sandbox Lab Preview</h2>
      <p id="previewDesc" style="color:var(--text-secondary); font-size:0.86rem; line-height:1.45;">Tune visual styles, animations, and wheel parameters in real time before promoting to production.</p>
      <div class="sandbox-pulse-box" id="pulseBox">⚡</div>
      <div id="statusLine" style="font-size:0.75rem; color:var(--text-muted);">Active Settings: Glow 18px | Shake 4° | Speed 1.75s</div>
    </div>
  </main>
  <div class="promote-toast" id="promoteToast">✅ Take ready for review at the Lock-In Gate!</div>
  <script>
    let activeTake = 'A';
    const card = document.getElementById('previewCard'), badge = document.getElementById('takeBadge'), title = document.getElementById('previewTitle'), desc = document.getElementById('previewDesc'), status = document.getElementById('statusLine');
    const glow = document.getElementById('glowSlider'), shake = document.getElementById('shakeSlider'), speed = document.getElementById('speedSlider'), toast = document.getElementById('promoteToast');
    function sync() {
      card.style.setProperty('--preview-glow', glow.value); card.style.setProperty('--preview-shake', shake.value); card.style.setProperty('--preview-speed', speed.value);
      document.getElementById('glowVal').textContent = glow.value + 'px'; document.getElementById('shakeVal').textContent = shake.value + '°'; document.getElementById('speedVal').textContent = speed.value + 's';
      status.textContent = `Active: Take ${activeTake} | Glow ${glow.value}px | Shake ${shake.value}° | Speed ${speed.value}s`;
    }
    [glow, shake, speed].forEach(s => s.addEventListener('input', sync)); sync();
    const takes = {
      A: { badge: 'TAKE A • OCEANIC SAPPHIRE', title: 'Oceanic Sapphire Flow', desc: 'Deep midnight blues with luminous ocean crests and soft rhythmic pulse.', border: 'rgba(56, 189, 248, 0.4)' },
      B: { badge: 'TAKE B • CYBER CYAN', title: 'High-Voltage Cyan', desc: 'Sharper electric contrast with neon edging and energetic pulse velocity.', border: '#00f0ff' },
      C: { badge: 'TAKE C • CELESTIAL VOID', title: 'Deep Void Starlight', desc: 'Dark abyssal backdrop with concentrated violet-cyan celestial flares.', border: '#a855f7' }
    };
    document.querySelectorAll('.take-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.take-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
      activeTake = btn.dataset.take; const t = takes[activeTake]; badge.textContent = t.badge; title.textContent = t.title; desc.textContent = t.desc; card.style.borderColor = t.border; sync();
    }));
    document.getElementById('btnPromote').addEventListener('click', () => {
      toast.textContent = `🚀 Take ${activeTake} locked! Tell your AI to promote Take ${activeTake} (Glow: ${glow.value}px, Shake: ${shake.value}°, Speed: ${speed.value}s).`;
      toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3500);
    });
  </script>
</body>
</html>
